[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevexp"
version = "0.1.0"
description = "Experiments for journal 010: calibrated typed-decision models (Jev, Laya) on Indonesian regional languages"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: tests that need downloaded data (run `python -m jevexp.data fetch` first)"]
